name: Smoke check

# Runs against the live site rather than a build, so it catches faults that
# only show up with real data. A failed run emails the repository owner, which
# is the point: nobody should have to click a link to discover an outage.
on:
  # The schedule is OFF while the hosting plan is close to its CPU limit.
  # Every page this check touches renders on demand, so each run spends the
  # allowance the site needs to stay up -- a monitor is not worth the thing it
  # monitors. It still runs on every push, and can be run by hand from the
  # Actions tab at any time.
  #
  # Turn it back on by uncommenting these two lines, ideally on a paid plan or
  # once the public pages are cached:
  # schedule:
  #   - cron: "17 * * * *"
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to check"
        required: false
        default: "https://www.navey.co"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # There used to be no install step, because every check used only Node
      # built-ins. The link-preview check broke that: it has to actually draw
      # the pictures, which needs `next`, and drawing them is the only thing
      # that catches a fault Satori will reject -- a type check cannot see it.
      #
      # Worth the thirty seconds. A check that runs only on somebody's laptop
      # is how a broken preview image sat unnoticed for a month and then killed
      # four deployments in a row. This is GitHub's time, not Vercel's, so it
      # costs nothing on the hosting plan.
      - name: Install dependencies
        run: npm ci

      - name: Rules, and the link previews
        run: npm test

      - name: Check the live site
        run: node scripts/smoke.mjs "${{ inputs.base_url || 'https://www.navey.co' }}"
